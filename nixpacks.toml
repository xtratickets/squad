providers = ["node"]

[phases.setup]
nixPkgs = ["nodejs_22", "openssl"]

[phases.install]
# Install all dependencies (including dev) for both root and frontend.
# Dev deps are required at build time (TypeScript compiler, Vite, etc.).
cmds = [
  "npm ci --no-audit --no-fund",
  "cd frontend && npm ci --no-audit --no-fund"
]

[phases.build]
cmds = [
  "npx prisma generate",
  "npm run build"
]

[start]
# Run migrations then start the server
cmd = "npx prisma migrate deploy && node dist/server.js"
